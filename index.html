<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wortkarten</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1C1B19">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #EDEEE8; color: #232220; font-family: 'IBM Plex Sans', sans-serif; }
  body { padding-bottom: 4rem; }
  h1, h2 { font-family: 'IBM Plex Serif', serif; font-weight: 600; margin: 0; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }

  .screen { display: none; }
  .screen.active { display: block; }

  .back-row { display: flex; align-items: center; justify-content: center; margin-bottom: 1.1rem; }
  .back-btn { border: none; background: #E1E1D8; color: #232220; font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 8px; cursor: pointer; }

  .card { background: #FFFFFF; border-radius: 14px; padding: 1.1rem; border: 1px solid #DEDDD3; margin-bottom: 1rem; }

  label.field-label { display: block; font-size: 12px; font-weight: 500; color: #6B6A63; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; text-align: center; }
  input[type="text"] { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid #D5D4C9; font-size: 15px; font-family: inherit; background: #FAF9F4; margin-bottom: 1rem; text-align: center; }
  input[type="text"]:focus { outline: none; border-color: #232220; }

  .word-row { display: flex; gap: 8px; margin-bottom: 1rem; }
  .word-row input { margin-bottom: 0; }
  .speak-btn {
    flex-shrink: 0; width: 42px; border-radius: 9px; border: 1px solid #D5D4C9; background: #FAF9F4;
    font-size: 16px; cursor: pointer; color: #6B6A63;
  }
  .speak-btn:active { transform: scale(0.95); }
  .speak-inline { border: none; background: none; cursor: pointer; font-size: 13px; color: #185FA5; padding: 2px 4px; }

  .photo-input-area { border: 1.5px dashed #C9C8BC; border-radius: 12px; padding: 1.2rem; text-align: center; margin-bottom: 1rem; background: #FAF9F4; cursor: pointer; position: relative; }
  .photo-input-area img { max-width: 100%; max-height: 220px; border-radius: 8px; display: block; margin: 0 auto; }
  .photo-input-area .hint { font-size: 13px; color: #8A8980; margin-top: 6px; }
  .photo-input-area input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

  .gender-row, .diff-row { display: flex; gap: 8px; margin-bottom: 1.1rem; }
  .gender-btn, .diff-btn { flex: 1; border-radius: 10px; border: 2px solid transparent; padding: 12px 4px; text-align: center; cursor: pointer; font-family: 'IBM Plex Sans'; }
  .gender-btn .art { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 15px; display: block; }
  .gender-btn .sub { font-size: 10.5px; opacity: 0.85; }
  .gb-blue { background: #E6F1FB; color: #0C447C; }
  .gb-blue.selected { border-color: #185FA5; background: #185FA5; color: #fff; }
  .gb-pink { background: #FBEAF0; color: #72243E; }
  .gb-pink.selected { border-color: #993556; background: #993556; color: #fff; }
  .gb-black { background: #E9E8E1; color: #232220; }
  .gb-black.selected { border-color: #1C1B19; background: #1C1B19; color: #fff; }

  .diff-btn { background: #FAF9F4; font-size: 15px; color: #6B6A63; }
  .diff-btn.selected { border-color: #BA7517; background: #FAEEDA; color: #633806; }
  .diff-btn.tier4.selected { border-color: #BA7517; background: linear-gradient(135deg,#FAEEDA,#F5D98A); color: #4A2E02; font-weight: 600; }

  button.primary { width: 100%; padding: 13px; border-radius: 10px; border: none; background: #1C1B19; color: #F4F3EC; font-size: 15px; font-weight: 500; font-family: 'IBM Plex Sans'; cursor: pointer; }
  button.primary:disabled { background: #C9C8BC; cursor: not-allowed; }
  button.primary:active:not(:disabled) { transform: scale(0.99); }
  button.danger { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid #C1443B; background: transparent; color: #C1443B; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; }

  .msg { font-size: 13px; padding: 8px 0; text-align: center; }
  .msg.ok { color: #2F8F5B; }
  .msg.err { color: #C1443B; }

  .word-list-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ECEBE2; }
  .word-list-item:last-child { border-bottom: none; }
  .thumb-wrap { position: relative; width: 46px; height: 46px; flex-shrink: 0; }
  .thumb-wrap img { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; display: block; }
  .star-badge { position: absolute; bottom: -4px; right: -4px; background: #1C1B19; color: #FAEEDA; font-size: 8.5px; font-weight: 600; padding: 1px 4px; border-radius: 6px; letter-spacing: 0.02em; }
  .star-badge.tier4 { background: linear-gradient(135deg,#BA7517,#F5D98A); color: #3A2200; }
  .word-list-item .info { flex: 1; min-width: 0; cursor: pointer; }
  .word-list-item .info .w { font-size: 14.5px; font-weight: 500; }
  .word-list-item .info .g { font-size: 12px; color: #8A8980; }
  .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
  .sw-blue { background: #185FA5; } .sw-pink { background: #993556; } .sw-black { background: #1C1B19; }
  .del-btn { border: none; background: none; color: #B8B6A9; font-size: 18px; cursor: pointer; padding: 4px 6px; }
  .del-btn:hover { color: #C1443B; }
  .empty-state { text-align: center; padding: 2.5rem 1rem; color: #8A8980; font-size: 14px; }

  .quiz-photo-wrap { text-align: center; margin-bottom: 0.6rem; }
  .quiz-photo-wrap img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; }
  .quiz-word-row { text-align: center; margin-bottom: 10px; }
  .case-tag { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.03em; text-transform: uppercase; color: #6B6A63; background: #E9E8E1; padding: 4px 10px; border-radius: 6px; margin-bottom: 10px; }
  .quiz-sentence { font-size: 16.5px; margin: 0 0 1.1rem; line-height: 1.5; text-align: center; }
  .quiz-sentence .blank { display: inline-block; min-width: 46px; border-bottom: 2px solid #C9C8BC; text-align: center; font-weight: 500; }
  .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1rem; }
  .opt-btn { padding: 11px 4px; border-radius: 9px; border: 1.5px solid #DEDDD3; background: #FAF9F4; font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; cursor: pointer; color: #232220; }
  .opt-btn.correct { background: #EAF3DE; border-color: #639922; color: #27500A; }
  .opt-btn.wrong { background: #FCEBEB; border-color: #E24B4A; color: #791F1F; }
  .opt-btn:disabled { cursor: default; }
  .feedback { font-size: 14px; padding: 10px 12px; border-radius: 9px; margin-bottom: 1rem; text-align: center; }
  .feedback.correct { background: #EAF3DE; color: #27500A; }
  .feedback.wrong { background: #FCEBEB; color: #791F1F; }
  .score-row { display: flex; justify-content: center; gap: 16px; font-size: 12.5px; color: #8A8980; margin-bottom: 1rem; }
  .btn-row { display: flex; gap: 8px; }
  .listen-btn, .next-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1.5px solid #1C1B19; background: transparent; color: #1C1B19; font-size: 14px; font-weight: 500; cursor: pointer; }
  .next-btn { background: #1C1B19; color: #F4F3EC; }

  .summary-stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ECEBE2; font-size: 13.5px; }
  .summary-stat:last-child { border-bottom: none; }
  .summary-stat .lbl { color: #6B6A63; }
  .summary-stat .val { font-weight: 500; }

  .home-header { padding: 1.75rem 0 1.75rem; text-align: center; }
  .home-header h1 { font-size: 23px; letter-spacing: -0.01em; }
  .home-status { margin: 8px 0 0; font-size: 13.5px; color: #6B6A63; }
  .menu-stack { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
  .pill {
    width: 100%; max-width: 300px; background: #FFFFFF; border: 1px solid #DEDDD3; border-radius: 999px;
    padding: 15px 1rem; text-align: center; cursor: pointer; font-size: 15px; font-weight: 500;
  }
  .pill .pill-sub { display: block; font-size: 11px; color: #8A8980; font-weight: 400; margin-top: 2px; }
  .settings-link { text-align: center; font-size: 12.5px; color: #8A8980; padding: 10px; cursor: pointer; }

  .onboard-wrap { padding: 3rem 0; text-align: center; }
  .onboard-wrap h1 { font-size: 24px; margin-bottom: 8px; }
  .onboard-wrap p { font-size: 13.5px; color: #6B6A63; margin-bottom: 1.5rem; }

  .streak-hero { text-align: center; padding: 1.5rem 0; }
  .streak-hero .num { font-family: 'IBM Plex Serif', serif; font-size: 44px; font-weight: 600; }
  .streak-hero .lbl { font-size: 13px; color: #6B6A63; }
  .ref-link { display: block; text-align: center; font-size: 13px; color: #185FA5; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="screen" id="screen-onboard">
    <div class="onboard-wrap">
      <h1>Wortkarten</h1>
      <p>What do you want me to call you?</p>
      <input type="text" id="onboardName" placeholder="Your name">
      <button class="primary" id="onboardSave">Continue</button>
    </div>
  </div>

  <div class="screen" id="screen-home">
    <div class="home-header">
      <h1 id="homeGreeting">Hello</h1>
      <p class="home-status" id="homeStatus"></p>
    </div>
    <div class="menu-stack">
      <div class="pill" data-go="add">Add words</div>
      <div class="pill" data-go="practice">Practice now<span class="pill-sub" id="dueSub"></span></div>
      <div class="pill" data-go="list">My words</div>
      <div class="pill" data-go="stats">Stats</div>
    </div>
    <div class="settings-link" id="goSettings">Settings</div>
  </div>

  <div class="screen" id="screen-add">
    <div class="back-row"><button class="back-btn" data-go="home">← Home</button></div>
    <div class="card">
      <label class="field-label">Photo</label>
      <div class="photo-input-area" id="photoArea">
        <div id="photoPlaceholder"><div style="font-size:28px;">+</div><div class="hint">Tap to take or choose a photo</div></div>
        <img id="photoPreview" style="display:none;">
        <input type="file" accept="image/*" capture="environment" id="photoInput">
      </div>

      <label class="field-label">German word</label>
      <div class="word-row">
        <input type="text" id="wordInput" placeholder="e.g. Tisch">
        <button class="speak-btn" id="previewSpeak" type="button">🔊</button>
      </div>

      <label class="field-label">Gender — tap to tag</label>
      <div class="gender-row">
        <div class="gender-btn gb-blue" data-g="masc"><span class="art">der</span><span class="sub">masculine</span></div>
        <div class="gender-btn gb-pink" data-g="fem"><span class="art">die</span><span class="sub">feminine</span></div>
        <div class="gender-btn gb-black" data-g="neut"><span class="art">das</span><span class="sub">neuter</span></div>
      </div>

      <label class="field-label">Difficulty</label>
      <div class="diff-row">
        <div class="diff-btn" data-d="1">★</div>
        <div class="diff-btn" data-d="2">★★</div>
        <div class="diff-btn" data-d="3">★★★</div>
        <div class="diff-btn tier4" data-d="4">★★★★</div>
      </div>

      <button class="primary" id="saveBtn" disabled>Save word</button>
      <div class="msg" id="saveMsg"></div>
    </div>
  </div>

  <div class="screen" id="screen-practice">
    <div class="back-row"><button class="back-btn" data-go="home">← Home</button></div>
    <div id="practiceArea"></div>
  </div>

  <div class="screen" id="screen-list">
    <div class="back-row"><button class="back-btn" data-go="home">← Home</button></div>
    <div class="card" id="listCard"><div class="empty-state">Loading…</div></div>
  </div>

  <div class="screen" id="screen-stats">
    <div class="back-row"><button class="back-btn" data-go="home">← Home</button></div>
    <div class="card">
      <div class="streak-hero"><div class="num" id="streakNum">0</div><div class="lbl">day streak</div></div>
      <div class="summary-stat"><span class="lbl">Best streak</span><span class="val" id="bestStreakVal">0</span></div>
      <div class="summary-stat"><span class="lbl">Words in deck</span><span class="val" id="totalWordsVal">0</span></div>
      <div class="summary-stat"><span class="lbl">Cards reviewed (all time)</span><span class="val" id="totalReviewsVal">0</span></div>
    </div>
    <div class="card" id="lastSessionCard" style="display:none;">
      <label class="field-label">Last session</label>
      <div id="lastSessionBody"></div>
    </div>
  </div>

  <div class="screen" id="screen-settings">
    <div class="back-row"><button class="back-btn" data-go="home">← Home</button></div>
    <div class="card">
      <label class="field-label">Your name</label>
      <input type="text" id="settingsName">
      <button class="primary" id="settingsSaveName">Save name</button>
    </div>
    <div class="card">
      <label class="field-label">Reference</label>
      <a class="ref-link" href="https://www.goethe.de/pro/relaunch/prf/de/A1_SD1_Wortliste_02.pdf" target="_blank" rel="noopener">Official Goethe A1 word list ↗</a>
    </div>
    <div class="card">
      <label class="field-label">Danger zone</label>
      <button class="danger" id="resetBtn">Reset everything</button>
      <div class="msg" id="resetMsg"></div>
    </div>
  </div>

</div>

<script>
const DECL = {
  masc: { nom: 'der', akk: 'den', dat: 'dem', gen: 'des' },
  fem:  { nom: 'die', akk: 'die', dat: 'der', gen: 'der' },
  neut: { nom: 'das', akk: 'das', dat: 'dem', gen: 'des' }
};
const GENDER_LABEL = { masc: 'der', fem: 'die', neut: 'das' };
const GENDER_SWATCH = { masc: 'sw-blue', fem: 'sw-pink', neut: 'sw-black' };
const CASE_LIST = ['nom', 'akk', 'dat', 'gen'];
const CASE_NAMES = { nom: 'Nominativ', akk: 'Akkusativ', dat: 'Dativ', gen: 'Genitiv' };
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

const CASE_TEMPLATES = {
  nom: [
    (a, w) => `${cap(a)} ${w} steht direkt hier.`,
    (a, w) => `${cap(a)} ${w} hat gestern gefehlt.`,
    (a, w) => `Weil ${a} ${w} kaputt ist, müssen wir etwas tun.`,
    (a, w) => `${cap(a)} ${w} war früher da, aber jetzt nicht mehr.`,
    (a, w) => `Trotzdem bleibt ${a} ${w} an seinem Platz.`
  ],
  akk: [
    (a, w) => `Ich sehe ${a} ${w}.`,
    (a, w) => `Ich habe ${a} ${w} gestern gekauft.`,
    (a, w) => `Weil ich ${a} ${w} brauche, gehe ich einkaufen.`,
    (a, w) => `Ich mag ${a} ${w}, aber nicht besonders.`,
    (a, w) => `Trotzdem nehme ich ${a} ${w} nicht mit.`
  ],
  dat: [
    (a, w) => `Ich spreche mit ${a} ${w}.`,
    (a, w) => `Ich habe mit ${a} ${w} gesprochen.`,
    (a, w) => `Weil ich mit ${a} ${w} rede, verstehe ich es besser.`,
    (a, w) => `Ich helfe ${a} ${w}, aber nur kurz.`,
    (a, w) => `Trotzdem vertraue ich ${a} ${w}.`
  ],
  gen: [
    (a, w) => `Die Farbe ${a} ${w} gefällt mir.`,
    (a, w) => `Wegen ${a} ${w} mussten wir warten.`,
    (a, w) => `Trotz ${a} ${w} sind wir pünktlich angekommen.`,
    (a, w) => `Das ist die Geschichte ${a} ${w}.`
  ]
};

const ENCOURAGEMENT = [
  "Ready when you are.",
  "Small steps, every day.",
  "Let's keep the streak alive.",
  "Your words are waiting.",
  "One session at a time.",
  "Consistency beats intensity.",
  "Back for more — good.",
  "Let's sharpen those cases.",
  "Today counts too.",
  "You've got this."
];

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

const STAR_TEXT = { 1: '★', 2: '★★', 3: '★★★', 4: '★★★★' };
const LADDER_DAYS = [1, 3, 7, 14];
const DAY_MS = 24 * 60 * 60 * 1000;
function todayStr() { return new Date().toISOString().slice(0, 10); }
function yesterdayStr() { return new Date(Date.now() - DAY_MS).toISOString().slice(0, 10); }
function newCaseState() { return { stage: -1, nextDue: todayStr(), correctCount: 0, wrongCount: 0 }; }
function nextInterval(stage) {
  if (stage < LADDER_DAYS.length - 1) return { stage: stage + 1, days: LADDER_DAYS[stage + 1] };
  const lastDays = LADDER_DAYS[LADDER_DAYS.length - 1];
  const randomDays = Math.round(lastDays * (1.4 + Math.random() * 1.2));
  return { stage: stage + 1, days: Math.min(randomDays, 90) };
}

let db = null;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('wortkarten-db', 2);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('words')) d.createObjectStore('words', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'id' });
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e);
  });
}
function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = (e) => reject(e);
  });
}
function dbGet(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = (e) => reject(e);
  });
}
function dbPut(store, entry) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(entry);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}
function dbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}
function dbClear(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

let words = [];
let userMeta = null;
let statsMeta = null;

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (name === 'home') renderHome();
  if (name === 'list') renderList();
  if (name === 'practice') startSession();
  if (name === 'stats') renderStats();
  if (name === 'settings') { document.getElementById('settingsName').value = userMeta ? userMeta.name : ''; }
}
document.querySelectorAll('[data-go]').forEach(el => { el.addEventListener('click', () => showScreen(el.dataset.go)); });
document.getElementById('goSettings').addEventListener('click', () => showScreen('settings'));

document.getElementById('onboardSave').addEventListener('click', async () => {
  const name = document.getElementById('onboardName').value.trim();
  if (!name) return;
  userMeta = { id: 'user', name };
  await dbPut('meta', userMeta);
  showScreen('home');
});
document.getElementById('settingsSaveName').addEventListener('click', async () => {
  const name = document.getElementById('settingsName').value.trim();
  if (!name) return;
  userMeta = { id: 'user', name };
  await dbPut('meta', userMeta);
  showScreen('home');
});

let resetStage = 0;
document.getElementById('resetBtn').addEventListener('click', async () => {
  const msg = document.getElementById('resetMsg');
  resetStage++;
  if (resetStage === 1) { msg.className = 'msg err'; msg.textContent = 'This deletes all words, stats, and your streak. Tap again to confirm.'; }
  else if (resetStage === 2) { msg.className = 'msg err'; msg.textContent = 'Really sure? Tap once more to permanently reset.'; }
  else {
    await dbClear('words'); await dbClear('meta');
    words = []; userMeta = null; statsMeta = null; resetStage = 0; msg.textContent = '';
    showScreen('onboard');
  }
});

function renderHome() {
  const line = ENCOURAGEMENT[Math.floor(Math.random() * ENCOURAGEMENT.length)];
  document.getElementById('homeGreeting').textContent = `Hello, ${userMeta ? userMeta.name : ''}`;
  const due = buildQueue();
  const doneToday = statsMeta && statsMeta.lastCompletedDate === todayStr();
  const statusEl = document.getElementById('homeStatus');
  const dueSub = document.getElementById('dueSub');
  if (words.length === 0) { statusEl.textContent = 'Add your first word to get started.'; dueSub.textContent = ''; }
  else if (doneToday) { statusEl.textContent = `Today's task is done. ${line}`; dueSub.textContent = 'Done for today'; }
  else if (due.length > 0) { statusEl.textContent = `${due.length} card${due.length === 1 ? '' : 's'} due today. ${line}`; dueSub.textContent = `${due.length} due`; }
  else { statusEl.textContent = `Nothing due right now. ${line}`; dueSub.textContent = ''; }
}

document.getElementById('previewSpeak').addEventListener('click', () => {
  const w = document.getElementById('wordInput').value.trim();
  if (w) speak(w);
});

document.getElementById('photoInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (ev) => {
    img.onload = () => {
      const maxW = 480;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      photoDataUrl = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('photoPreview').src = photoDataUrl;
      document.getElementById('photoPreview').style.display = 'block';
      document.getElementById('photoPlaceholder').style.display = 'none';
      checkSaveReady();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

let selectedGender = null;
let selectedDiff = null;
let photoDataUrl = null;

document.querySelectorAll('.gender-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedGender = btn.dataset.g;
    checkSaveReady();
  });
});
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedDiff = btn.dataset.d;
    checkSaveReady();
  });
});
document.getElementById('wordInput').addEventListener('input', checkSaveReady);

function checkSaveReady() {
  const word = document.getElementById('wordInput').value.trim();
  const ready = word.length > 0 && selectedGender && selectedDiff && photoDataUrl;
  document.getElementById('saveBtn').disabled = !ready;
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const word = document.getElementById('wordInput').value.trim();
  const cases = {};
  CASE_LIST.forEach(c => { cases[c] = newCaseState(); });
  const entry = { id: Date.now().toString(), word, gender: selectedGender, difficulty: parseInt(selectedDiff, 10), photo: photoDataUrl, createdAt: new Date().toISOString(), cases };
  await dbPut('words', entry);
  words.push(entry);
  const msgEl = document.getElementById('saveMsg');
  msgEl.textContent = `Saved — ${GENDER_LABEL[selectedGender]} ${word}`;
  msgEl.className = 'msg ok';
  document.getElementById('wordInput').value = '';
  selectedGender = null; selectedDiff = null; photoDataUrl = null;
  document.querySelectorAll('.gender-btn, .diff-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('photoPreview').style.display = 'none';
  document.getElementById('photoPlaceholder').style.display = 'block';
  document.getElementById('saveBtn').disabled = true;
  setTimeout(() => { msgEl.textContent = ''; }, 2500);
});

function renderList() {
  const card = document.getElementById('listCard');
  if (words.length === 0) { card.innerHTML = '<div class="empty-state">No words yet. Add your first one from the home screen.</div>'; return; }
  card.innerHTML = words.slice().reverse().map(w => `
    <div class="word-list-item" data-id="${w.id}">
      <div class="thumb-wrap">
        <img src="${w.photo}">
        <span class="star-badge ${w.difficulty === 4 ? 'tier4' : ''}">${STAR_TEXT[w.difficulty] || ''}</span>
      </div>
      <div class="info" data-speak="${w.word}">
        <div class="w"><span class="swatch ${GENDER_SWATCH[w.gender]}"></span>${GENDER_LABEL[w.gender]} ${w.word} <span class="speak-inline">🔊</span></div>
        <div class="g">${w.gender === 'masc' ? 'masculine' : w.gender === 'fem' ? 'feminine' : 'neuter'}</div>
      </div>
      <button class="del-btn" data-del="${w.id}">×</button>
    </div>
  `).join('');
  card.querySelectorAll('[data-speak]').forEach(el => { el.addEventListener('click', () => speak(el.dataset.speak)); });
  card.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await dbDelete('words', btn.dataset.del);
      words = words.filter(w => w.id !== btn.dataset.del);
      renderList();
    });
  });
}

let sessionQueue = [], retryPool = [], currentItem = null, currentFullSentence = '';
let sessionStats = { total: 0, correct: 0, byWord: {}, byCase: {} };

function buildQueue() {
  const today = todayStr();
  const due = [];
  words.forEach(w => { CASE_LIST.forEach(c => { if (w.cases[c].nextDue <= today) due.push({ wordId: w.id, c }); }); });
  for (let i = due.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [due[i], due[j]] = [due[j], due[i]]; }
  return due;
}

function startSession() {
  sessionQueue = buildQueue();
  retryPool = [];
  sessionStats = { total: 0, correct: 0, byWord: {}, byCase: {} };
  nextCard();
}

function nextCard() {
  if (sessionQueue.length === 0 && retryPool.length > 0) { sessionQueue = retryPool; retryPool = []; }
  if (sessionQueue.length === 0) { finishSession(); return; }
  currentItem = sessionQueue.shift();
  renderQuestion();
}

function renderQuestion() {
  const w = words.find(x => x.id === currentItem.wordId);
  if (!w) { nextCard(); return; }
  const c = currentItem.c;
  const correctArt = DECL[w.gender][c];
  const allForms = ['der', 'die', 'das', 'den', 'dem', 'des'];
  const distractors = shuffle(allForms.filter(f => f !== correctArt));
  const options = shuffle([correctArt, distractors[0], distractors[1]]);
  const templates = CASE_TEMPLATES[c];
  const template = templates[Math.floor(Math.random() * templates.length)];
  const sentence = template('___', w.word);
  currentFullSentence = template(correctArt, w.word);
  const parts = sentence.split('___');
  const remaining = sessionQueue.length + retryPool.length + 1;
  const area = document.getElementById('practiceArea');
  area.innerHTML = `
    <div class="score-row"><span>Session: ${sessionStats.correct}/${sessionStats.total}</span><span>${remaining} card${remaining === 1 ? '' : 's'} left today</span></div>
    <div class="card">
      <div class="quiz-photo-wrap"><img src="${w.photo}"></div>
      <div class="quiz-word-row"><span class="speak-inline" id="speakWordBtn">🔊 hear word</span></div>
      <div style="text-align:center;"><div class="case-tag">${CASE_NAMES[c]}</div></div>
      <p class="quiz-sentence">${parts[0]}<span class="blank" id="blankSlot">___</span>${parts[1]}</p>
      <div class="options-grid" id="optsGrid">${options.map(o => `<button class="opt-btn" data-opt="${o}">${o}</button>`).join('')}</div>
      <div id="feedbackSlot"></div>
      <div class="btn-row" id="afterRow" style="display:none;">
        <button class="listen-btn" id="listenBtn">🔊 Listen to sentence</button>
        <button class="next-btn" id="nextBtn">Next card →</button>
      </div>
    </div>
  `;
  document.getElementById('speakWordBtn').addEventListener('click', () => speak(w.word));
  document.querySelectorAll('.opt-btn').forEach(btn => btn.addEventListener('click', () => handleAnswer(btn.dataset.opt, w, c, correctArt)));
}

async function handleAnswer(chosen, w, c, correctArt) {
  const isCorrect = chosen === correctArt;
  sessionStats.total++;
  if (isCorrect) sessionStats.correct++;
  sessionStats.byWord[w.id] = sessionStats.byWord[w.id] || { word: w.word, attempts: 0 };
  sessionStats.byWord[w.id].attempts++;
  sessionStats.byCase[c] = sessionStats.byCase[c] || { correct: 0, total: 0 };
  sessionStats.byCase[c].total++;
  if (isCorrect) sessionStats.byCase[c].correct++;

  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.opt === correctArt) btn.classList.add('correct');
    else if (btn.dataset.opt === chosen) btn.classList.add('wrong');
  });
  document.getElementById('blankSlot').textContent = correctArt;
  const fb = document.getElementById('feedbackSlot');
  fb.innerHTML = `<div class="feedback ${isCorrect ? 'correct' : 'wrong'}">${isCorrect ? 'Right.' : 'Not quite — this one will come back later today.'} ${GENDER_LABEL[w.gender]} ${w.word} → ${CASE_NAMES[c]}: <strong>${correctArt} ${w.word}</strong></div>`;

  const caseState = w.cases[c];
  if (isCorrect) {
    const { stage, days } = nextInterval(caseState.stage);
    caseState.stage = stage; caseState.correctCount++;
    caseState.nextDue = new Date(Date.now() + days * DAY_MS).toISOString().slice(0, 10);
  } else {
    caseState.stage = -1; caseState.wrongCount++; caseState.nextDue = todayStr();
    retryPool.push({ wordId: w.id, c });
    if (retryPool.length >= 2) { const insertAt = Math.min(2, sessionQueue.length); sessionQueue.splice(insertAt, 0, retryPool.shift()); }
  }
  await dbPut('words', w);
  statsMeta.totalReviews = (statsMeta.totalReviews || 0) + 1;
  await dbPut('meta', statsMeta);

  document.getElementById('afterRow').style.display = 'flex';
  document.getElementById('listenBtn').onclick = () => speak(currentFullSentence);
  document.getElementById('nextBtn').onclick = nextCard;
}

async function finishSession() {
  const area = document.getElementById('practiceArea');
  if (sessionStats.total === 0) { area.innerHTML = '<div class="card"><div class="empty-state">Nothing due right now. Add words or come back after their next interval.</div></div>'; return; }
  let worstWord = null;
  Object.values(sessionStats.byWord).forEach(w => { if (!worstWord || w.attempts > worstWord.attempts) worstWord = w; });
  let worstCase = null;
  Object.entries(sessionStats.byCase).forEach(([c, s]) => { const acc = s.correct / s.total; if (!worstCase || acc < worstCase.acc) worstCase = { c, acc }; });

  const today = todayStr();
  if (statsMeta.lastCompletedDate !== today) {
    if (statsMeta.lastCompletedDate === yesterdayStr()) statsMeta.streakCurrent = (statsMeta.streakCurrent || 0) + 1;
    else statsMeta.streakCurrent = 1;
    statsMeta.streakBest = Math.max(statsMeta.streakBest || 0, statsMeta.streakCurrent);
    statsMeta.lastCompletedDate = today;
  }
  statsMeta.lastSession = {
    total: sessionStats.total, correct: sessionStats.correct,
    worstWord: worstWord ? worstWord.word : null, worstWordAttempts: worstWord ? worstWord.attempts : null,
    worstCase: worstCase ? CASE_NAMES[worstCase.c] : null, worstCaseAcc: worstCase ? Math.round(worstCase.acc * 100) : null
  };
  await dbPut('meta', statsMeta);

  area.innerHTML = `
    <div class="card">
      <h2 style="font-size:17px; margin-bottom: 12px; text-align:center;">All done for today</h2>
      <div class="summary-stat"><span class="lbl">Cards reviewed</span><span class="val">${sessionStats.total}</span></div>
      <div class="summary-stat"><span class="lbl">Accuracy</span><span class="val">${Math.round(sessionStats.correct / sessionStats.total * 100)}%</span></div>
      ${worstWord ? `<div class="summary-stat"><span class="lbl">Most attempts</span><span class="val">${worstWord.word} (${worstWord.attempts})</span></div>` : ''}
      ${worstCase ? `<div class="summary-stat"><span class="lbl">Weakest case</span><span class="val">${CASE_NAMES[worstCase.c]} (${Math.round(worstCase.acc * 100)}%)</span></div>` : ''}
      <div class="summary-stat"><span class="lbl">Streak</span><span class="val">${statsMeta.streakCurrent} day${statsMeta.streakCurrent === 1 ? '' : 's'}</span></div>
    </div>
  `;
}

function renderStats() {
  document.getElementById('streakNum').textContent = statsMeta.streakCurrent || 0;
  document.getElementById('bestStreakVal').textContent = statsMeta.streakBest || 0;
  document.getElementById('totalWordsVal').textContent = words.length;
  document.getElementById('totalReviewsVal').textContent = statsMeta.totalReviews || 0;
  const ls = statsMeta.lastSession;
  const lsCard = document.getElementById('lastSessionCard');
  if (ls) {
    lsCard.style.display = 'block';
    document.getElementById('lastSessionBody').innerHTML = `
      <div class="summary-stat"><span class="lbl">Cards reviewed</span><span class="val">${ls.total}</span></div>
      <div class="summary-stat"><span class="lbl">Accuracy</span><span class="val">${Math.round(ls.correct / ls.total * 100)}%</span></div>
      ${ls.worstWord ? `<div class="summary-stat"><span class="lbl">Most attempts</span><span class="val">${ls.worstWord} (${ls.worstWordAttempts})</span></div>` : ''}
      ${ls.worstCase ? `<div class="summary-stat"><span class="lbl">Weakest case</span><span class="val">${ls.worstCase} (${ls.worstCaseAcc}%)</span></div>` : ''}
    `;
  } else { lsCard.style.display = 'none'; }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

async function init() {
  db = await openDB();
  words = await dbGetAll('words');
  userMeta = await dbGet('meta', 'user');
  statsMeta = await dbGet('meta', 'stats');
  if (!statsMeta) { statsMeta = { id: 'stats', streakCurrent: 0, streakBest: 0, lastCompletedDate: null, totalReviews: 0 }; await dbPut('meta', statsMeta); }
  if (!userMeta) showScreen('onboard'); else showScreen('home');
}
init();
</script>
